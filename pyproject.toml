[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-chord-dht"
version = "1.0.0"
description = "Simple Chord DHT hash ring simulation for Topic 61"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "matplotlib>=3.8,<4.0",
  "networkx>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
